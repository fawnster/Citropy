name: Portable regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-latest]
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # These regressions use Node built-ins and Git, not Electron or a display server.
      # Run directly: retries must never turn a first-run failure into a green check.
      - name: Check request, filesystem, proxy, and CI regressions
        run: >-
          node --experimental-strip-types --test --test-reporter=tap --test-concurrency=1
          tests/audit-static.test.mjs tests/audit-files.test.mjs
          tests/audit-remote-proxy.test.mjs tests/audit-test-ci.test.mjs
          tests/audit-diff.test.mjs tests/audit-terminal-daemon.test.mjs
          tests/audit-http.test.mjs tests/audit-diff-paths.test.mjs
          tests/audit-containment-race.test.mjs tests/audit-tree-aba.test.mjs
          tests/audit-zero-hunk.test.mjs tests/audit-git-paths.test.mjs
          tests/audit-git-filename-diffs.test.mjs

  http-boundary:
    name: HTTP boundary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      # The real backend imports third-party runtime dependencies, so keep this
      # integration check separate from the dependency-free portable matrix.
      - run: npm ci
      - name: Check real backend HTTP boundary
        run: >-
          node --experimental-strip-types --test --test-reporter=tap
          tests/audit-http-server.test.mjs
