name: Check and package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11 python3-dbus python3-gi gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6 libfuse2 openssh-server
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run desktop:package
      - run: npm run desktop:smoke
      - name: Checksum release files
        working-directory: release
        run: sha256sum *.AppImage latest-linux.yml > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/latest-linux.yml
            release/SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-screenshots
          if-no-files-found: ignore
          path: release/smoke-*.png
