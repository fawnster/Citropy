name: Publish authorized Citropy 0.4.2

# One-time owner-authorized completion of PR #23.
# Existing release.yml, checks and signing policy remain unchanged.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-0.4.2.yml]

permissions:
  contents: read
concurrency:
  group: authorized-citropy-release-0.4.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write
    steps:
      - name: Build, verify and publish authorized 0.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u <<'PY'
          """Publish only the maintainer-authorized 0.4.2 after existing release gates and asset verification."""
          import base64
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request
          
          REPO = 'tinuxongit/Citropy'
          VERSION = '0.4.2'
          TAG = 'v' + VERSION
          BASE = '8a1d169f9d1d397e4a6f322a8842742d054c1ae0'
          SELF = '.github/workflows/publish-0.4.2.yml'
          RELEASE_BLOB = '23964acd05085c97c374b2cc8950f97de9be1c13'
          ASSETS = {f'Citropy-{VERSION}-x86_64.AppImage', f'Citropy-{VERSION}-arm64.zip',
                    f'Citropy-{VERSION}-x64.zip', f'Citropy-{VERSION}-x64-Setup.exe',
                    f'Citropy-{VERSION}-x64-Setup.exe.blockmap', 'latest-linux.yml',
                    'latest-mac.yml', 'latest.yml', 'SHA256SUMS'}
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def api(path, method='GET', data=None, missing=False):
              """Retry only transient reads. Never automatically repeat a release mutation."""
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2026-03-10'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except urllib.error.HTTPError as error:
                      if missing and error.code == 404:
                          return None
                      if method != 'GET' or error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise RuntimeError(f'{method} {path}: HTTP {error.code}') from None
                  except (urllib.error.URLError, TimeoutError):
                      if method != 'GET' or attempt == 2:
                          raise RuntimeError(f'{method} {path}: network error') from None
                  time.sleep(5 * (attempt + 1))
          
          
          def releases_for_tag():
              """Use the release collection: lookup-by-tag intentionally excludes draft releases."""
              matches = []
              for page in range(1, 21):
                  batch = api(f'releases?per_page=100&page={page}')
                  matches.extend(r for r in batch if r['tag_name'] == TAG)
                  if len(batch) < 100:
                      return matches
              raise RuntimeError('Release pagination limit reached')
          
          
          def wait_run(run_id, source, workflow, names):
              deadline = time.monotonic() + 80 * 60
              last = None
              while time.monotonic() < deadline:
                  run = api(f'actions/runs/{run_id}')
                  require(run['head_sha'] == source and run['head_branch'] == 'main'
                          and run['path'] == '.github/workflows/' + workflow, 'Wrong workflow source')
                  require(run['run_attempt'] == 1, 'A retried workflow cannot certify a clean first attempt')
                  state = (run['status'], run['conclusion'])
                  if state != last:
                      print(f'Run {run_id}: {state}', flush=True)
                      last = state
                  if run['status'] == 'completed':
                      require(run['conclusion'] == 'success', 'Workflow did not pass; release remains unpublished')
                      listing = api(f'actions/runs/{run_id}/jobs?per_page=100')
                      jobs = listing['jobs']
                      require(listing['total_count'] == len(jobs) == len(names)
                              and {j['name'] for j in jobs} == names, 'Missing or unexpected jobs')
                      require(all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs),
                              'Not all jobs passed')
                      return run
                  time.sleep(30)
              raise RuntimeError('Workflow observation timeout; nothing will be published')
          
          
          def file_hash(path, algorithm):
              digest = hashlib.new(algorithm)
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest
          
          
          def verify_assets(assets, directory):
              require(len(assets) == len(ASSETS) and {a['name'] for a in assets} == ASSETS, 'Incomplete assets')
              require({p.name for p in directory.iterdir()} == ASSETS, 'Unexpected downloaded files')
              for asset in assets:
                  path = directory / asset['name']
                  require(path.is_file() and not path.is_symlink() and asset['state'] == 'uploaded', 'Unsafe asset')
                  require(path.stat().st_size == asset['size'] and asset['size'] > 0, 'Asset size mismatch')
                  require(asset.get('digest') == 'sha256:' + file_hash(path, 'sha256').hexdigest(), 'Asset digest mismatch')
              checksums = {}
              for line in (directory / 'SHA256SUMS').read_text().splitlines():
                  match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
                  require(match is not None, 'Malformed checksum manifest')
                  digest, name = match.groups()
                  require(name in ASSETS - {'SHA256SUMS'} and name not in checksums, 'Invalid checksum entry')
                  checksums[name] = digest
              require(set(checksums) == ASSETS - {'SHA256SUMS'}, 'Incomplete checksum manifest')
              for name, digest in checksums.items():
                  require(file_hash(directory / name, 'sha256').hexdigest() == digest, 'Checksum mismatch: ' + name)
              metadata = {'latest-linux.yml': {f'Citropy-{VERSION}-x86_64.AppImage'},
                          'latest-mac.yml': {f'Citropy-{VERSION}-arm64.zip', f'Citropy-{VERSION}-x64.zip'},
                          'latest.yml': {f'Citropy-{VERSION}-x64-Setup.exe'}}
              for name, files in metadata.items():
                  text = (directory / name).read_text()
                  require(re.search(r'^version: ' + re.escape(VERSION) + r'\s*$', text, re.M), 'Wrong updater version')
                  entries = re.findall(r'^\s*- url: (\S+)\s*\n\s+sha512: (\S+)\s*\n\s+size: (\d+)\s*$', text, re.M)
                  require(len(entries) == len(files) and {e[0] for e in entries} == files, 'Wrong updater files')
                  for filename, digest, size in entries:
                      path = directory / filename
                      require(path.stat().st_size == int(size), 'Wrong updater size')
                      require(base64.b64encode(file_hash(path, 'sha512').digest()).decode() == digest, 'Wrong updater SHA-512')
                  legacy = re.search(r'^path: (\S+)\s*\nsha512: (\S+)\s*$', text, re.M)
                  require(legacy is not None and legacy[1] in files, 'Wrong updater fallback')
                  require(base64.b64encode(file_hash(directory / legacy[1], 'sha512').digest()).decode() == legacy[2],
                          'Wrong updater fallback SHA-512')
          
          
          def content(path, ref):
              return json.loads(base64.b64decode(api(f'contents/{path}?ref={ref}')['content']))
          
          
          def fingerprint(assets):
              return sorted((a['id'], a['name'], a['size'], a.get('digest'), a['state']) for a in assets)
          
          
          def main():
              require(os.environ.get('GITHUB_REPOSITORY') == REPO and os.environ.get('GITHUB_REF') == 'refs/heads/main'
                      and os.environ.get('GITHUB_EVENT_NAME') == 'push' and os.environ.get('GITHUB_RUN_ATTEMPT') == '1',
                      'Only the authorized first main-branch push is allowed')
              source = os.environ['GITHUB_SHA']
              change = api(f'compare/{BASE}...{source}')
              require(change['status'] == 'ahead' and change['total_commits'] == 1
                      and [(f['filename'], f['status']) for f in change['files']] == [(SELF, 'added')],
                      'Only the one-time publisher may follow the verified merge')
              require(api(f'contents/.github/workflows/release.yml?ref={source}')['sha'] == RELEASE_BLOB,
                      'The existing release workflow changed')
              require(content('package.json', source)['version'] == '0.4.1', 'Unexpected starting version')
              require(not releases_for_tag() and api(f'git/ref/tags/{TAG}', missing=True) is None,
                      'Existing release or tag requires inspection; never rebuild or retag blindly')
              active = api('actions/workflows/release.yml/runs?per_page=100')['workflow_runs']
              require(all(r['status'] == 'completed' for r in active), 'Another release is active')
              require(api('git/ref/heads/main')['object']['sha'] == source, 'Main moved before dispatch')
              dispatched = api('actions/workflows/release.yml/dispatches', method='POST',
                               data={'ref': 'main', 'inputs': {'version': VERSION}, 'return_run_details': True})
              require(isinstance(dispatched, dict) and type(dispatched.get('workflow_run_id')) is int,
                      'Dispatch response ambiguous; inspect runs instead of repeating the mutation')
              run_id = dispatched['workflow_run_id']
              print('Release build: ' + dispatched['html_url'], flush=True)
              built = wait_run(run_id, source, 'release.yml', {'check', 'linux', 'mac', 'windows', 'publish'})
              require(built['event'] == 'workflow_dispatch', 'Unexpected release trigger')
              portable = {f'{p} / Node {n}' for p in ('ubuntu-22.04', 'macos-26', 'windows-latest')
                          for n in ('22.18.0', '24', '26')}
              portable |= {f'HTTP boundary / {p}' for p in ('ubuntu-22.04', 'macos-26', 'windows-latest')}
              verified = []
              for workflow, names in [('checks.yml', {'check', 'mac', 'windows'}), ('portable-regressions.yml', portable)]:
                  runs = api(f'actions/workflows/{workflow}/runs?head_sha={source}&event=push&per_page=100')['workflow_runs']
                  require(len(runs) == 1, 'Missing or ambiguous exact-source CI')
                  verified.append(wait_run(runs[0]['id'], source, workflow, names)['html_url'])
              candidates = releases_for_tag()
              require(len(candidates) == 1, 'Expected exactly one draft release')
              release = api(f'releases/{candidates[0]["id"]}')
              require(release['draft'] and not release['prerelease'] and release['tag_name'] == TAG, 'Wrong draft')
              tag = api(f'git/ref/tags/{TAG}')['object']
              require(tag['type'] == 'commit', 'Unexpected tag type')
              release_sha = tag['sha']
              require([p['sha'] for p in api(f'git/commits/{release_sha}')['parents']] == [source], 'Wrong release source')
              diff = api(f'compare/{source}...{release_sha}')
              require(diff['total_commits'] == 1 and {f['filename'] for f in diff['files']} == {'package.json', 'package-lock.json'},
                      'Unexpected release commit files')
              for path in ('package.json', 'package-lock.json'):
                  expected = copy.deepcopy(content(path, source))
                  expected['version'] = VERSION
                  if path.endswith('lock.json'):
                      expected['packages']['']['version'] = VERSION
                  require(content(path, release_sha) == expected, 'Release changes more than version fields')
              require(api('git/ref/heads/main')['object']['sha'] == release_sha, 'Main moved before verification')
              assets = release['assets']
              require(len(assets) == len(ASSETS) and {a['name'] for a in assets} == ASSETS, 'Incomplete asset list')
              require(all(type(a['id']) is int and a['id'] > 0 for a in assets)
                      and len({a['id'] for a in assets}) == len(assets), 'Invalid asset IDs')
              with tempfile.TemporaryDirectory(prefix='citropy-0.4.2-verified-') as directory:
                  for asset in assets:
                      print('Verifying download: ' + asset['name'], flush=True)
                      with (Path(directory) / asset['name']).open('xb') as output:
                          subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'GET',
                                          '-H', 'Accept: application/octet-stream',
                                          f'repos/{REPO}/releases/assets/{asset["id"]}'], stdout=output, check=True, timeout=600)
                  verify_assets(assets, Path(directory))
              print('All 9 assets, SHA256SUMS and updater SHA-512/size/version metadata verified.', flush=True)
              notes = f'''## Citropy {VERSION} — consistent workspace branch labels
          
          Fixes the sidebar/titlebar branch mismatch reported in PR #23.
          
          - Synchronizes saved branch metadata for conversations and subagents sharing the same checkout after branch switches, renames and refreshes, and persists it across restarts.
          - Keeps separate worktrees isolated; the titlebar no longer borrows a previous worktree's project-level Git cache.
          - Preserves conversation activity timestamps, ordering, messages and run state. This fix does not checkout, reset, or modify working files.
          - Restores the project-branch fallback for legacy/current-checkout conversations with missing branch metadata, without applying it to unknown isolated worktrees. Explicit empty and detached labels are preserved.
          - Adds real-Git regression coverage and browser tests for both labels, delayed replies and fallback cases. Includes all previous 0.4.1 audit fixes.
          
          ### Verification
          - Release build, typecheck, production audit, full tests and Linux/macOS/Windows package/smoke/installer gates: {built['html_url']}
          - Exact-source full check/package: {verified[0]}
          - Exact-source portable and HTTP regressions (12 jobs): {verified[1]}
          - These three workflows passed on their first attempts. All nine assets were downloaded and checked against GitHub SHA-256 digests, SHA256SUMS and updater SHA-512/size/version metadata before publication.
          
          Build source: `{source}`. Release/tag commit: `{release_sha}`.
          Publication verification: https://github.com/{REPO}/actions/runs/{os.environ['GITHUB_RUN_ID']}
          
          ### Downloads and limits
          Linux x86_64 AppImage, macOS arm64 and x64 ZIPs, Windows x64 installer, update metadata and checksums. The existing signing/notarization policy is unchanged. CI does not prove every hardware, filesystem timing or external provider configuration.
          '''
              require(api(f'git/ref/tags/{TAG}')['object']['sha'] == release_sha, 'Tag moved during verification')
              require(api('git/ref/heads/main')['object']['sha'] == release_sha, 'Main moved during verification')
              fresh = api(f'releases/{release["id"]}')
              require(fresh['draft'] and fresh['tag_name'] == TAG and not fresh['prerelease']
                      and fingerprint(fresh['assets']) == fingerprint(assets), 'Draft changed during verification')
              api(f'releases/{release["id"]}', method='PATCH',
                  data={'draft': False, 'prerelease': False, 'make_latest': 'true', 'body': notes})
              published = api(f'releases/{release["id"]}')
              require(not published['draft'] and not published['prerelease'] and published['published_at']
                      and published['tag_name'] == TAG and fingerprint(published['assets']) == fingerprint(assets),
                      'Publication was not confirmed')
              require(api('releases/latest')['id'] == release['id'], 'Latest release was not confirmed')
              print('Published: ' + published['html_url'], flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'Published [{TAG}]({published["html_url"]}) at `{release_sha}` after all checks and asset verification.\n')
              api('actions/workflows/publish-0.4.2.yml/disable', method='PUT')
          
          
          if __name__ == '__main__':
              main()
          PY
