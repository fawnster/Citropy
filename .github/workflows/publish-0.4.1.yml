name: Publish authorized Citropy 0.4.1

# One-time completion of the maintainer's explicit release request after PR #22.
# This only dispatches the existing Release workflow and verifies its draft.
# It does not change release.yml, its checks, or its packaging/signing policy.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.4.1.yml']

permissions:
  contents: read

concurrency:
  group: publish-authorized-0.4.1
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tinuxongit/Citropy'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    steps:
      - name: Build, verify and publish the authorized release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -u <<'PY'
          """One-time, fail-closed publisher for the explicitly authorized Citropy 0.4.1 release."""
          import base64
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request
          
          REPO = 'tinuxongit/Citropy'
          VERSION = '0.4.1'
          TAG = 'v' + VERSION
          BASE = '26eaae26ff6c6ddf978978290bb60cfd3881f9e4'
          SELF = '.github/workflows/publish-0.4.1.yml'
          RELEASE_BLOB = '23964acd05085c97c374b2cc8950f97de9be1c13'
          ASSETS = {
              'Citropy-0.4.1-x86_64.AppImage', 'Citropy-0.4.1-arm64.zip',
              'Citropy-0.4.1-x64.zip', 'Citropy-0.4.1-x64-Setup.exe',
              'Citropy-0.4.1-x64-Setup.exe.blockmap', 'latest-linux.yml',
              'latest-mac.yml', 'latest.yml', 'SHA256SUMS',
          }
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def api(path, method='GET', data=None, missing=False):
              """Retry transient reads, never retry a dispatch or publication mutation."""
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + '/' + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2026-03-10'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          text = response.read()
                          return json.loads(text) if text else None
                  except urllib.error.HTTPError as exc:
                      if missing and exc.code == 404:
                          return None
                      if method != 'GET' or exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise RuntimeError(f'{method} {path}: HTTP {exc.code}') from None
                  except urllib.error.URLError:
                      if method != 'GET' or attempt == 2:
                          raise RuntimeError(f'{method} {path}: network error') from None
                  time.sleep(5 * (attempt + 1))
          
          
          def content(path, ref):
              result = api(f'contents/{path}?ref={ref}')
              return json.loads(base64.b64decode(result['content']))
          
          
          def verify_run(run, sha, names, jobs):
              require(run['head_sha'] == sha and run['head_branch'] == 'main', 'Wrong source in workflow run')
              require(run['status'] == 'completed' and run['conclusion'] == 'success', 'Workflow did not pass')
              require(run['run_attempt'] == 1, 'A retried workflow cannot certify a clean first attempt')
              require(len(jobs) == len(names) and {j['name'] for j in jobs} == names, 'Missing or unexpected workflow jobs')
              require(all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs), 'Not every job passed')
          
          
          def wait_run(run_id, sha, names):
              """Observe one exact run; failures are terminal, not candidates for reruns."""
              deadline = time.monotonic() + 75 * 60
              last = None
              while time.monotonic() < deadline:
                  run = api(f'actions/runs/{run_id}')
                  require(run['head_sha'] == sha and run['head_branch'] == 'main', 'Workflow source moved')
                  require(run['run_attempt'] == 1, 'Unexpected workflow retry')
                  state = (run['status'], run['conclusion'])
                  if state != last:
                      print(f"Run {run_id}: {state}", flush=True)
                      last = state
                  if run['status'] == 'completed':
                      jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
                      verify_run(run, sha, names, jobs)
                      return run
                  time.sleep(30)
              raise RuntimeError(f'Timed out observing run {run_id}; nothing will be published')
          
          
          def verify_version_change(before, after, lock=False):
              expected = copy.deepcopy(before)
              expected['version'] = VERSION
              if lock:
                  expected['packages']['']['version'] = VERSION
              require(after == expected, 'Release commit changes more than package version fields')
          
          
          def file_hash(path, algorithm):
              digest = hashlib.new(algorithm)
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest
          
          
          def verify_assets(assets, directory):
              require(len(assets) == len(ASSETS) and {a['name'] for a in assets} == ASSETS, 'Incomplete release asset set')
              require({p.name for p in directory.iterdir()} == ASSETS, 'Unexpected downloaded files')
              for asset in assets:
                  path = directory / asset['name']
                  require(asset['state'] == 'uploaded' and path.is_file() and not path.is_symlink(), 'Unfinished or unsafe asset')
                  require(path.stat().st_size == asset['size'] and asset['size'] > 0, 'Asset size mismatch')
                  require(asset.get('digest') == 'sha256:' + file_hash(path, 'sha256').hexdigest(), 'GitHub asset digest mismatch')
              manifest = {}
              for line in (directory / 'SHA256SUMS').read_text().splitlines():
                  match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
                  require(match is not None, 'Malformed checksum manifest')
                  digest, name = match.groups()
                  require(name in ASSETS - {'SHA256SUMS'} and name not in manifest, 'Invalid checksum entry')
                  manifest[name] = digest
              require(set(manifest) == ASSETS - {'SHA256SUMS'}, 'Checksum manifest is incomplete')
              for name, digest in manifest.items():
                  require(file_hash(directory / name, 'sha256').hexdigest() == digest, 'Checksum mismatch: ' + name)
              expected_metadata = {
                  'latest-linux.yml': {'Citropy-0.4.1-x86_64.AppImage'},
                  'latest-mac.yml': {'Citropy-0.4.1-arm64.zip', 'Citropy-0.4.1-x64.zip'},
                  'latest.yml': {'Citropy-0.4.1-x64-Setup.exe'},
              }
              # Accept only the simple electron-builder metadata schema emitted by this release.
              for name, expected_files in expected_metadata.items():
                  text = (directory / name).read_text()
                  require(re.search(r'^version: 0\.4\.1\s*$', text, re.M) is not None, 'Wrong updater version')
                  entries = re.findall(r'^\s*- url: (\S+)\s*\n\s+sha512: (\S+)\s*\n\s+size: (\d+)\s*$', text, re.M)
                  require(len(entries) == len(expected_files) and {e[0] for e in entries} == expected_files, 'Wrong updater files')
                  for filename, digest, size in entries:
                      path = directory / filename
                      require(path.stat().st_size == int(size), 'Wrong updater asset size')
                      require(base64.b64encode(file_hash(path, 'sha512').digest()).decode() == digest, 'Wrong updater SHA-512')
                  legacy = re.search(r'^path: (\S+)\s*\nsha512: (\S+)\s*$', text, re.M)
                  require(legacy is not None and legacy[1] in expected_files, 'Invalid updater fallback path')
                  require(base64.b64encode(file_hash(directory / legacy[1], 'sha512').digest()).decode() == legacy[2], 'Wrong fallback SHA-512')
          
          
          def main():
              require(os.environ.get('GITHUB_REPOSITORY') == REPO and os.environ.get('GITHUB_REF') == 'refs/heads/main'
                      and os.environ.get('GITHUB_EVENT_NAME') == 'push', 'Only the authorized main-branch push is allowed')
              source = os.environ['GITHUB_SHA']
              existing = api(f'releases/tags/{TAG}', missing=True)
              if existing is not None and not existing['draft']:
                  print('Release already published; no changes: ' + existing['html_url'])
                  return
              require(existing is None and api(f'git/ref/tags/{TAG}', missing=True) is None, 'Existing draft or tag requires inspection')
              change = api(f'compare/{BASE}...{source}')
              require(change['status'] == 'ahead' and change['total_commits'] == 1
                      and [(f['filename'], f['status']) for f in change['files']] == [(SELF, 'added')],
                      'Launcher must be the only change since the verified audit merge')
              require(api(f'contents/.github/workflows/release.yml?ref={source}')['sha'] == RELEASE_BLOB,
                      'The audited release workflow changed')
              require(content('package.json', source)['version'] == '0.4.0', 'Unexpected starting version')
              active = api('actions/workflows/release.yml/runs?per_page=100')['workflow_runs']
              require(all(r['status'] == 'completed' for r in active), 'Another release is active')
              require(api('git/ref/heads/main')['object']['sha'] == source, 'Main moved before release dispatch')
              dispatched = api('actions/workflows/release.yml/dispatches', method='POST',
                               data={'ref': 'main', 'inputs': {'version': VERSION}})
              run_id = dispatched['workflow_run_id']
              require(isinstance(run_id, int) and run_id > 0, 'Dispatch did not return a run ID; do not retry blindly')
              print('Release build: ' + dispatched['html_url'], flush=True)
              wait_run(run_id, source, {'check', 'linux', 'mac', 'windows', 'publish'})
              # In addition to the release gates, require both push workflows on the exact source.
              portable = {f'{platform} / Node {node}' for platform in ('ubuntu-22.04', 'macos-26', 'windows-latest')
                          for node in ('22.18.0', '24', '26')}
              portable |= {f'HTTP boundary / {p}' for p in ('ubuntu-22.04', 'macos-26', 'windows-latest')}
              verified = []
              for workflow, names in [('checks.yml', {'check', 'mac', 'windows'}), ('portable-regressions.yml', portable)]:
                  runs = api(f'actions/workflows/{workflow}/runs?head_sha={source}&event=push&per_page=100')['workflow_runs']
                  require(len(runs) == 1, 'Missing or ambiguous source CI runs')
                  verified.append(wait_run(runs[0]['id'], source, names)['html_url'])
              release = api(f'releases/tags/{TAG}')
              require(release['draft'] and not release['prerelease'] and release['tag_name'] == TAG, 'Expected a stable draft release')
              tag = api(f'git/ref/tags/{TAG}')['object']
              require(tag['type'] == 'commit', 'Unexpected release tag type')
              release_sha = tag['sha']
              commit = api(f'git/commits/{release_sha}')
              require([p['sha'] for p in commit['parents']] == [source], 'Release was not built from this source')
              diff = api(f'compare/{source}...{release_sha}')
              require(diff['total_commits'] == 1 and {f['filename'] for f in diff['files']} == {'package.json', 'package-lock.json'},
                      'Unexpected code changes in release commit')
              for path in ('package.json', 'package-lock.json'):
                  verify_version_change(content(path, source), content(path, release_sha), lock=path.endswith('lock.json'))
              require(api('git/ref/heads/main')['object']['sha'] == release_sha, 'Main moved before publication')
              with tempfile.TemporaryDirectory(prefix='citropy-verified-release-') as directory:
                  subprocess.run(['gh', 'release', 'download', TAG, '--repo', REPO, '--dir', directory], check=True, timeout=600)
                  verify_assets(release['assets'], Path(directory))
              notes = f'''## Citropy {VERSION} — safety and stability fixes
          
          Includes the complete critical audit from PR #22: literal Git filename selection to protect unrelated work; safer request/error handling; file and directory containment regressions; bounded UTF-8-safe previews; corrected diff paths and hunks; proxy and terminal-daemon cleanup; and first-failure-preserving cross-platform CI.
          
          ### Verification
          - Release build, Linux/macOS/Windows packaging, smoke and installer checks: {dispatched['html_url']}
          - Full source check/package: {verified[0]}
          - Portable source regressions (12 jobs): {verified[1]}
          - All runs passed on their first attempt. All nine uploaded assets were downloaded and verified against GitHub digests; SHA256SUMS and updater SHA-512/size/version metadata were validated before publication.
          
          Source: `{source}`. Release commit: `{release_sha}`.
          
          ### Downloads and limits
          Linux x86_64 AppImage, macOS arm64 and x64 ZIPs, and Windows x64 installer are included, with update metadata and checksums. This release retains the repository's existing signing/distribution policy; it does not claim new notarization or trusted-platform signing, universal hardware compatibility, or that every possible defect is eliminated.
          '''
              # Recheck mutable refs and asset metadata immediately before the sole publish write.
              require(api(f'git/ref/tags/{TAG}')['object']['sha'] == release_sha, 'Release tag moved')
              require(api('git/ref/heads/main')['object']['sha'] == release_sha, 'Main changed during verification')
              fresh = api(f'releases/{release["id"]}')
              fingerprint = lambda assets: sorted((a['id'], a['name'], a['size'], a.get('digest'), a['state']) for a in assets)
              require(fresh['draft'] and fingerprint(fresh['assets']) == fingerprint(release['assets']),
                      'Release assets changed during verification')
              result = api(f'releases/{release["id"]}', method='PATCH',
                           data={'draft': False, 'prerelease': False, 'make_latest': 'true', 'body': notes})
              require(not result['draft'] and result['published_at'], 'Publication was not confirmed')
              print('Published: ' + result['html_url'], flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'Published [{TAG}]({result["html_url"]}) at `{release_sha}` after all checks and asset verification.\n')
              # This launcher is deliberately single-use. The normal release workflow is unchanged.
              api('actions/workflows/publish-0.4.1.yml/disable', method='PUT')
          
          
          if __name__ == '__main__':
              main()
          PY
