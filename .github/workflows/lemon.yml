name: Lemon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lemon
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11 python3-dbus python3-gi gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6 libfuse2 openssh-server
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Check the installer scripts
        run: |
          sh -n scripts/install.sh
          shellcheck -s sh scripts/install.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'

  linux:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
      - run: npm ci
      - name: Set version
        run: |
          NEXT=$(node -e "const v = JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('.').map(Number); v[2] += 1; console.log(v.join('.'))")
          npm version "$NEXT-lemon.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - name: Package
        env:
          CITROPY_CHANNEL: lemon
        run: npm run desktop:package
      - name: Check the artifact
        run: test -f release/Citropy-lemon-x86_64.AppImage
      - name: Test the installer
        run: |
          mkdir -p lemondist/lemon
          cp release/Citropy-lemon-x86_64.AppImage lemondist/lemon/
          (cd lemondist/lemon && sha256sum *.AppImage > SHA256SUMS && printf '{"version":"%s"}\n' "$(node -e "console.log(require('./package.json').version)")" > version.json)
          (cd lemondist && python3 -m http.server 8792 >/dev/null 2>&1 &)
          for attempt in $(seq 1 40); do
            curl -fsS --connect-timeout 2 --max-time 5 -o /dev/null "http://127.0.0.1:8792/" && break
            sleep 0.5
          done
          curl -fsS --connect-timeout 2 --max-time 5 -o /dev/null "http://127.0.0.1:8792/" || { echo "The local release server did not answer on port 8792." >&2; exit 1; }
          HOME="$RUNNER_TEMP/lemon-home" CITROPY_BASE_URL="http://127.0.0.1:8792" sh scripts/install.sh --channel=lemon
          test -x "$RUNNER_TEMP/lemon-home/.local/bin/citropy-lemon"
          test -f "$RUNNER_TEMP/lemon-home/.local/share/applications/citropy-lemon.desktop"
          grep -q 'StartupWMClass=citropy-lemon' "$RUNNER_TEMP/lemon-home/.local/share/applications/citropy-lemon.desktop"
      - uses: actions/upload-artifact@v7
        with:
          name: lemon-linux
          if-no-files-found: error
          path: release/*.AppImage

  mac:
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Set version
        run: |
          NEXT=$(node -e "const v = JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('.').map(Number); v[2] += 1; console.log(v.join('.'))")
          npm version "$NEXT-lemon.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - name: Package
        env:
          CITROPY_CHANNEL: lemon
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run desktop:package -- --mac
      - name: Check the artifacts
        run: |
          test -f release/Citropy-lemon-arm64.zip
          test -f release/Citropy-lemon-x64.zip
      - run: node desktop/smoke-mac.mjs
      - name: Test the installer
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          mkdir -p macdist/lemon
          cp release/*.zip macdist/lemon/
          (cd macdist/lemon && shasum -a 256 *.zip > SHA256SUMS && printf '{"version":"%s"}\n' "$VERSION" > version.json)
          (cd macdist && python3 -m http.server 8793 >/dev/null 2>&1 &)
          for attempt in $(seq 1 40); do
            curl -fsS --connect-timeout 2 --max-time 5 -o /dev/null "http://127.0.0.1:8793/" && break
            sleep 0.5
          done
          curl -fsS --connect-timeout 2 --max-time 5 -o /dev/null "http://127.0.0.1:8793/" || { echo "The local release server did not answer on port 8793." >&2; exit 1; }
          HOME="$RUNNER_TEMP/lemon-home" CITROPY_BASE_URL="http://127.0.0.1:8793" sh scripts/install.sh --channel=lemon
          APP="$RUNNER_TEMP/lemon-home/Applications/Citropy Lemon.app"
          test -x "$APP/Contents/MacOS/Citropy Lemon"
          codesign --verify --deep --strict "$APP"
      - uses: actions/upload-artifact@v7
        with:
          name: lemon-mac
          if-no-files-found: error
          path: release/*.zip

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Set version
        run: |
          NEXT=$(node -e "const v = JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('.').map(Number); v[2] += 1; console.log(v.join('.'))")
          npm version "$NEXT-lemon.${GITHUB_RUN_NUMBER}" --no-git-tag-version
        shell: bash
      - name: Package the Windows app
        env:
          CITROPY_CHANNEL: lemon
        run: npm run desktop:package -- --win
      - name: Check the artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "release/Citropy-lemon-x64-Setup.exe")) { throw "Citropy-lemon-x64-Setup.exe is missing." }
      - name: Test the installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir = "windist/lemon"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "release/*.exe" $dir
          $lines = Get-ChildItem "$dir/*.exe" | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Path "$dir/SHA256SUMS" -Value $lines
          Set-Content -Path "$dir/version.json" -Value "{`"version`":`"$version`"}"
          $server = Start-Process python -ArgumentList "-m","http.server","8795","--directory","windist" -PassThru
          $ready = $false
          for ($attempt = 0; $attempt -lt 40 -and -not $ready; $attempt++) {
            if ($server.HasExited) { throw "The local release server exited with code $($server.ExitCode)." }
            try { Invoke-WebRequest -Uri "http://127.0.0.1:8795/" -UseBasicParsing -TimeoutSec 2 | Out-Null; $ready = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw "The local release server did not answer on port 8795." }
          try {
            $env:CITROPY_CHANNEL = "lemon"
            $env:CITROPY_BASE_URL = "http://127.0.0.1:8795"
            ./scripts/install.ps1
            $installed = Join-Path $env:LOCALAPPDATA "Programs\citropy-lemon\Citropy Lemon.exe"
            if (-not (Test-Path $installed)) { throw "The installer finished but $installed is missing." }
            $stableFolder = Join-Path $env:LOCALAPPDATA "Programs\citropy"
            if (Test-Path $stableFolder) { throw "Lemon installed into the stable folder." }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        with:
          name: lemon-windows
          if-no-files-found: error
          path: release/*.exe

  publish:
    needs: [linux, mac, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the version file
        run: |
          NEXT=$(node -e "const v = JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('.').map(Number); v[2] += 1; console.log(v.join('.'))")
          printf '{"version":"%s-lemon.%s"}\n' "$NEXT" "${GITHUB_RUN_NUMBER}" > dist/version.json
          cat dist/version.json
      - name: Checksum release files
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the Lemon build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Rolling Lemon build from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d)."
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/lemon" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/lemon" -X PATCH -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
          if ! gh release view lemon >/dev/null 2>&1; then
            gh release create lemon --prerelease --title "Citropy Lemon" --notes "$NOTES"
          fi
          gh release upload lemon dist/*.AppImage dist/*.zip dist/*.exe dist/version.json --clobber
          gh release upload lemon dist/SHA256SUMS --clobber
          gh release edit lemon --title "Citropy Lemon" --notes "$NOTES"
