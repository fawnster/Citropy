name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Releases must run from main."; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const next = process.env.VERSION; if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(next)) throw new Error(`Version must look like 0.2.0, got ${next}`); const current = JSON.parse(fs.readFileSync("package.json", "utf8")).version; const compare = (left, right) => { const a = left.split(".").map(Number); const b = right.split(".").map(Number); return a[0] - b[0] || a[1] - b[1] || a[2] - b[2]; }; if (compare(next, current) <= 0) throw new Error(`Version ${next} must be greater than ${current}`);'
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11 python3-dbus python3-gi gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6 libfuse2 openssh-server
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  release:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool dbus-x11 python3-dbus python3-gi gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6 libfuse2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - run: npm run desktop:package
      - run: npm run desktop:smoke
      - name: Checksum release files
        working-directory: release
        run: sha256sum *.AppImage latest-linux.yml > SHA256SUMS
      - name: Commit version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$VERSION"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" release/*.AppImage release/latest-linux.yml release/SHA256SUMS --verify-tag --draft --title "Citropy $VERSION" --generate-notes
