appId: com.citropy.desktop
productName: Citropy
directories:
  app: .desktop-build
  output: release
asar: false
files:
  - desktop/**
  - server/**
  - shared/**
  - skills/**
  - dist/**
  - package.json
  - LICENSE
  - '!desktop/package.mjs'
  - '!desktop/electron-builder.yml'
  - '!desktop/install.mjs'
  - '!desktop/start.mjs'
  - '!desktop/smoke.mjs'
  - '!desktop/smoke-mac.mjs'
linux:
  target: AppImage
  category: Development
  icon: desktop/assets/citropy.png
  executableName: citropy
  syncDesktopName: true
  artifactName: Citropy-${version}-${arch}.AppImage
mac:
  target:
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: desktop/assets/citropy.png
  identity: '-'
  hardenedRuntime: false
  artifactName: Citropy-${version}-${arch}.zip
publish:
  provider: github
  owner: tinuxongit
  repo: Citropy
  private: false
